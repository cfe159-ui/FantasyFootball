[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ff-agent"
version = "0.1.0"
description = "Fantasy football assistant: Yahoo league state plus free public NFL data"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "pyarrow>=14",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "scipy>=1.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
podcasts = ["faster-whisper>=1.0", "feedparser>=6.0"]

[project.scripts]
ff = "cli:main"

[tool.setuptools.package-data]
"ff.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["ff", "ff.sources", "ff.advice", "ff.model", "ff.web"]
py-modules = ["cli"]
